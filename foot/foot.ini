font=BerkeleyMono Nerd Font:size=12

[key-bindings]
# Workaround for spawning a terminal with command options
spawn-terminal=None
pipe-visible=[/home/kevin/.config/.scripts/shell.sh] Control+Shift+n

[colors-dark]
alpha=0.9
background=000000
foreground=ffffff
# flash=7f7f00
# flash-alpha=0.5

## Normal/regular colors (color palette 0-7)
regular0=000000  # black
regular1=cd0000  # red
regular2=00cd00  # green
regular3=cdcd00  # yellow
#regular4=0000ee  # blue
regular4=5c5cff  # blue
regular5=cd00cd  # magenta
regular6=00cdcd  # cyan
regular7=e5e5e5  # white

## Bright colors (color palette 8-15)
bright0=7f7f7f   # bright black
bright1=ff0000   # bright red
bright2=00ff00   # bright green
bright3=ffff00   # bright yellow
bright4=5c5cff   # bright blue
bright5=ff00ff   # bright magenta
bright6=00ffff   # bright cyan
bright7=ffffff   # bright white

21=ffb700

[colors-light]
alpha=0.9

background=ffffff
foreground=000000
# flash=cccc00
# flash-alpha=0.3

## Normal/regular colors (color palette 0-7)
regular0=ffffff  # black -> light background
regular1=cd0000  # red
regular2=008000  # green (slightly darker than original to pop on white)
regular3=aa8800  # yellow (muted for visibility)
regular4=0000aa  # blue
regular5=800080  # magenta
regular6=008b8b  # cyan
regular7=333333  # white -> dark gray for readability

## Bright colors (color palette 8-15)
bright0=bbbbbb   # bright black -> soft gray
bright1=ff0000   # bright red
bright2=00aa00   # bright green
bright3=ffaa00   # bright yellow
bright4=0000ff   # bright blue
bright5=aa00aa   # bright magenta
bright6=00aaaa   # bright cyan
bright7=000000   # bright white -> actual black for contrast

21=ffb700         # same extra color as in dark theme
